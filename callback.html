<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horst Ads · Conectar TikTok</title>
<style>
:root{--bg:#f6f7f6;--fg:#18201c;--muted:#5b6862;--line:#d9e0dc;--accent:#1d4d3c}
@media (prefers-color-scheme: dark){:root{--bg:#101513;--fg:#e7eee9;--muted:#9eada6;--line:#2a3631;--accent:#8fd6b6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:60ch;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.6rem}
code{display:block;word-break:break-all;background:var(--line);padding:12px;border-radius:10px;font-size:14px}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
p{margin:0}.muted{color:var(--muted);font-size:.9rem}
</style></head><body><main>
<h1>Conectar conta do TikTok</h1>
<p id="msg">Lendo a resposta do TikTok…</p>
<code id="code" hidden></code>
<button id="copy" hidden>Copiar código</button>
<p class="muted">Cole o código na conversa com o Claude. Ele vale por poucos minutos e só funciona uma vez.</p>
</main>
<script>
const q=new URLSearchParams(location.search), code=q.get("code"), err=q.get("error");
const msg=document.getElementById("msg"), box=document.getElementById("code"), btn=document.getElementById("copy");
if(code){msg.textContent="Autorização recebida. Copie o código abaixo:";box.textContent=code;box.hidden=false;btn.hidden=false;}
else if(err){msg.textContent="O TikTok não autorizou: "+(q.get("error_description")||err);}
else{msg.textContent="Nenhum código nesta página. Abra o link de conexão que o Claude enviou.";}
btn.onclick=async()=>{try{await navigator.clipboard.writeText(code);btn.textContent="Copiado"}catch(_){const r=document.createRange();r.selectNodeContents(box);getSelection().removeAllRanges();getSelection().addRange(r);btn.textContent="Selecionado, copie pelo menu"}};
</script></body></html>
